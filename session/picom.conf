# Defaults scoped to the wm session, not the user's compositor configuration.
# https://github.com/yshui/picom/blob/next/picom.sample.conf
backend = "glx";
vsync = true;
shadow = false;
shadow-radius = 8;
shadow-opacity = 0.15;
blur-method = "none";
blur-background = false;
blur-background-frame = false;
# st defaults to an opaque background; no compositor opacity override.
