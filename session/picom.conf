# Defaults scoped to the wm session, not the user's compositor configuration.
# https://github.com/yshui/picom/blob/next/picom.sample.conf
backend = "glx";
vsync = true;
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.15;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
# st supplies its own 0.9 alpha; do not apply opacity a second time.
