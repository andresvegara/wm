# Awesome: synchronized presentation without visual effects.
backend = "glx";
vsync = true;
unredir-if-possible = false;
shadow = false;
fading = false;
blur-method = "none";
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

# Keep terminal effects disabled even if a client requests opacity.
blur-background-exclude = [ "class_g = 'St'", "class_g = 'st-256color'", "class_i = 'st'" ];
opacity-rule = [ "100:class_g = 'St'", "100:class_g = 'st-256color'", "100:class_i = 'st'" ];
